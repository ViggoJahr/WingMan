name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, typecheck and test
        run: npm run check

      - name: Build
        # next build runs the type checker over the route tree as well, which is
        # where a bad server/client boundary shows up - `tsc --noEmit` alone
        # does not catch those. The keys are placeholders: nothing is queried at
        # build time, but @supabase/ssr throws on a missing URL at import.
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
